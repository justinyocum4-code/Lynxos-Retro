              /* The marker carries the short system code ('n64' /
                 'psx'); the page maps it the same way for display. */
              private static String systemDisplayName(String system) {
                  return "n64".equals(system) ? "Nintendo 64" : "PlayStation";
              }
              /* F5 (v1.4.7): visible record of a silent death, shown
                 as a line on the library screen until the next game
                 starts or the user dismisses it. Prefs-backed with
                 commit() so it survives a process death. F3 (v1.4.8):
                 the core rides along, e.g. "Nintendo 64 (Mupen) — ...". */
              private void storeLastPlayerClose(String system, String core, String title, String reason) {
                  try {
                      String when = new SimpleDateFormat("MMM d, h:mm a", Locale.US).format(new Date());
                      String display = systemDisplayName(system);
                      if ("n64".equals(system) && core != null && !core.isEmpty()) {
                          display += " (" + ("mupen".equals(core) ? "Mupen" : "Parallel") + ")";
                      }
                      String record = display + " — " + title + " — closed unexpectedly. " + reason + " " + when;
                      getSharedPreferences(PLAYER_PREFS, MODE_PRIVATE).edit()
                          .putString(LAST_CLOSE_KEY, record).commit();
                  } catch (Exception ignored) {}
              }
              private static String escapeJs(String s) {
                  if (s == null) return "";
                  return s.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ").replace("\r", " ");
              }

