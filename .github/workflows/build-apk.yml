name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code (whole number, bump every build)'
        required: false
        default: '1'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'First release'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Android NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          sdkmanager "ndk;27.2.12479018"

      - name: Fetch native PS1 core
        run: |
          mkdir -p app/src/main/assets/native
          curl -sL --retry 3 --retry-delay 5 -o /tmp/pcsx_rearmed.zip "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip"
          echo "102e22c7bd62b03758880b1b5be2c11381f8159d1233c54991b9af21a0c32b3b  /tmp/pcsx_rearmed.zip" | sha256sum -c -
          unzip -o -j /tmp/pcsx_rearmed.zip -d app/src/main/assets/native
          ls -la app/src/main/assets/native

      - name: Fetch native N64 cores
        run: |
          mkdir -p app/src/main/assets/native
          curl -sL --retry 3 --retry-delay 5 -o /tmp/parallel_n64.zip "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/parallel_n64_libretro_android.so.zip"
          echo "74b18a551d9194ff4869ec0cf77b8b9c944bb9570a4d0dde255da0019a767028  /tmp/parallel_n64.zip" | sha256sum -c -
          curl -sL --retry 3 --retry-delay 5 -o /tmp/mupen64plus_next_gles3.zip "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mupen64plus_next_gles3_libretro_android.so.zip"
          echo "2b88ba6e1feb06a68ec1efc921211b684f1aa096f9763914ade277bc334375f6  /tmp/mupen64plus_next_gles3.zip" | sha256sum -c -
          unzip -o -j /tmp/parallel_n64.zip -d app/src/main/assets/native
          unzip -o -j /tmp/mupen64plus_next_gles3.zip -d app/src/main/assets/native
          echo "38f14a287256b1938a0fc0435cb8893535c6ddead33d235e617f470a60066368  app/src/main/assets/native/parallel_n64_libretro_android.so" | sha256sum -c -
          echo "41e3733bab6c5cda6e6d883c7599635f2e05285572d6a7e68d8b3f95c5df2815  app/src/main/assets/native/mupen64plus_next_gles3_libretro_android.so" | sha256sum -c -
          ls -la app/src/main/assets/native

      - name: Scaffold Android project
        env:
          APP_VERSION_NAME: ${{ inputs.version_name }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          echo "=== Files in repo ==="
          ls -la
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found in the repository root."
            exit 1
          fi
          echo "Using $HTML_FILE as the app page."
          if ! grep -q 'id="lynxos-retro-app"' "$HTML_FILE"; then
            echo "ERROR: $HTML_FILE is not the Lynxos Retro app file (lynxos-retro-app marker missing)."
            exit 1
          fi
          if [ ! -f "assets/emulatorjs/data/loader.js" ]; then
            echo "ERROR: assets/emulatorjs/data/loader.js is missing (EmulatorJS data not bundled)."
            exit 1
          fi
          if [ ! -f "assets/emulatorjs/data/cores/fceumm-wasm.data" ]; then
            echo "ERROR: EmulatorJS cores are missing from assets/emulatorjs/data/cores/."
            exit 1
          fi

          mkdir -p app/src/main/java/com/lynxosretro/app app/src/main/assets/www app/src/main/res/xml
          cp "$HTML_FILE" app/src/main/assets/www/index.html
          cp supabase-config.js app/src/main/assets/www/supabase-config.js
          cp drive-config.js app/src/main/assets/www/drive-config.js
          cp -r assets app/src/main/assets/www/assets
          if [ ! -f "NativePlayerActivity.kt" ]; then
            echo "ERROR: NativePlayerActivity.kt is missing (native PS1 player source)."
            exit 1
          fi
          cp NativePlayerActivity.kt app/src/main/java/com/lynxosretro/app/NativePlayerActivity.kt
          if [ ! -f "NativeN64PlayerActivity.kt" ]; then
            echo "ERROR: NativeN64PlayerActivity.kt is missing (native N64 player source)."
            exit 1
          fi
          cp NativeN64PlayerActivity.kt app/src/main/java/com/lynxosretro/app/NativeN64PlayerActivity.kt
          if [ ! -f "lynxos_n64_jni.c" ]; then
            echo "ERROR: lynxos_n64_jni.c is missing (native N64 bridge source)."
            exit 1
          fi
          mkdir -p app/src/main/cpp
          cp lynxos_n64_jni.c app/src/main/cpp/lynxos_n64_jni.c
          if [ ! -f "CMakeLists.txt" ]; then
            echo "ERROR: CMakeLists.txt is missing (native N64 build)."
            exit 1
          fi
          cp CMakeLists.txt app/src/main/cpp/CMakeLists.txt
          echo "App files copied into assets/www:"
          du -sh app/src/main/assets/www

          # TV (Leanback) banner so the app shows in the TV launcher row.
          mkdir -p app/src/main/res/drawable
          if [ -f tv_banner.png ]; then
            cp tv_banner.png app/src/main/res/drawable/tv_banner.png
            echo "TV banner copied from repo."
          else
            pip install --quiet pillow
            python3 - <<'PYEOF'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (320, 180), (0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rectangle([4, 4, 315, 175], outline=(245, 197, 24), width=6)
          d.text((30, 55), "LYNXO", fill=(245, 197, 24))
          d.text((30, 92), "RETRO", fill=(255, 255, 255))
          img.save("app/src/main/res/drawable/tv_banner.png")
          print("TV banner generated.")
          PYEOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LynxosRetro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '2.4.20' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lynxosretro.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.lynxosretro.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
              }
              // Kotlin defaults to JVM 17 (the workflow's JDK) while
              // the Java compile defaults to 1.8; the build refuses
              // to mix them, so pin both to 17.
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                  }
              }
              ndkVersion "27.2.12479018"
          }
          dependencies {
              implementation 'dev.kotlinds:libretro-kmp:0.1.2'
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:label="Lynxos Retro"
                  android:banner="@drawable/tv_banner"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name="com.lynxosretro.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <!-- Auth deep link: email confirmation + password reset -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.lynxosretro.app" android:host="auth-callback" />
                      </intent-filter>
                  </activity>
                  <!-- Native PlayStation player: real ARM code, launched
                       from the library for PS1 games only. -->
                  <activity
                      android:name="com.lynxosretro.app.NativePlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" />
                  <!-- Native Nintendo 64 player: real ARM code with a
                       custom EGL bridge, launched from the library for
                       N64 games only. -->
                  <activity
                      android:name="com.lynxosretro.app.NativeN64PlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" />
                  <!-- Remote key service: sees the remote's app
                       buttons (YouTube, Netflix, ...) before the
                       system launches their apps. Only active while
                       a game is playing on TV; otherwise it passes
                       every key through untouched. -->
                  <service
                      android:name="com.lynxosretro.app.RemoteKeyService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/remote_key_service" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/remote_key_service.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Lynxos Retro remote key service: only watches remote
               button presses (flagRequestFilterKeyEvents). It cannot
               read the screen (canRetrieveWindowContent=false) and
               ignores accessibility events entirely. -->
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_service_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canRequestFilterKeyEvents="true" />
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="accessibility_service_description">Lets Lynxos Retro use the remote\'s bottom app buttons (YouTube, Netflix and the rest) as game buttons while a game is playing. It only watches remote button presses; it does not read the screen or collect anything.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/lynxosretro/app/MainActivity.java <<'EOF'
          package com.lynxosretro.app;

          import android.app.Activity;
          import android.app.UiModeManager;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.util.Base64;
          import android.view.KeyEvent;
          import android.view.InputDevice;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileChooserCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private boolean backArmed = false;
              private String pendingAuthUrl = null;
              private boolean pageReady = false;
              private boolean gamePlaying = false;
              private boolean isTV = false;
              /* Native-player export state: the page sends a PS1 game
                 1 MB at a time; nativeEnd launches the player. */
              private File nativeGameFile;
              private FileOutputStream nativeOut;
              private String nativeTitle = "";
              private long nativeTotal = 0;
              private long nativeWritten = 0;
              private boolean nativePlayerLaunched = false;
              /* Extract-once cache (v1.4.4): finished native exports
                 live in filesDir/extracted-games/<key>/ — filesDir,
                 not cacheDir, so the OS never evicts them. The key
                 is the sanitised title + "__" + system. main.txt
                 in the folder names the play file and is only
                 written by nativeEnd after its byte-count checks
                 pass, so its presence means a complete export. */
              /* Which system the export in progress is for ("psx" or
                 "n64") and, for N64, which core the page picked
                 ("parallel" or "mupen"). nativeEnd uses both to pick
                 the player Activity. */
              private String nativeSystem = "";
              private String nativeCore = "";
              /* Multi-file export (archive case): the page unpacks
                 the archive and sends the disc files one at a time
                 into native-games/<title>/; nativeEnd launches with
                 the file named by nativeSetMainFile. */
              private File nativeMultiDir;
              private File nativeMainFile;
              private boolean nativeMulti = false;
              private long backDownTime = 0;
              private boolean backHeld = false;
              private boolean backChordUsed = false;
              private boolean runLatched = false;
              private long lastChDnUpTime = 0;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private static MainActivity instance;

              /* Player outcome reporting (v1.4.4): the native
                 players' own speech may be silent on the TV, so a
                 player that fails, stops, hangs or draws no picture
                 reports its outcome here; onResume hands it to the
                 page, which announces it through TalkBack. Soft
                 outcomes (no picture while running) only stick when
                 nothing is set yet; hard ones (failure, stop, hang)
                 overwrite. */
              private static String pendingOutcomeSystem = null;
              private static String pendingOutcomeKind = null;
              private static String pendingOutcomeReason = null;
              public static synchronized void reportPlayerOutcome(String system, String kind, String reason, boolean hard) {
                  clearPlayerLaunchMarker();
                  if (hard || pendingOutcomeKind == null) {
                      pendingOutcomeSystem = system;
                      pendingOutcomeKind = kind;
                      pendingOutcomeReason = reason;
                  }
              }

              /* Silent-death marker (v1.4.5): the player Activity
                 sets this when it launches; a clean exit or a
                 reported outcome clears it. If MainActivity comes
                 back (or restarts after a crash) and the marker is
                 still there, the player died without saying anything
                 — a native crash in the core, or a Java Error — and
                 the page says so instead of staying silent. The
                 marker carries system|title|time; markers older
                 than 10 minutes are dropped silently (the app may
                 simply have been killed while backgrounded). */
              private static final String PLAYER_PREFS = "lynxos-retro";
              private static final String PLAYER_LAUNCH_KEY = "playerLaunch";
              private static final String PLAYER_STAGE_KEY = "playerLoadStage";
              private static final long PLAYER_MARKER_MAX_AGE_MS = 10L * 60L * 1000L;
              private static void setPlayerLaunchMarker(String system, String title) {
                  try {
                      MainActivity a = instance;
                      if (a == null) return;
                      a.getSharedPreferences(PLAYER_PREFS, MODE_PRIVATE).edit()
                          .putString(PLAYER_LAUNCH_KEY, system + "|" + title + "|" + System.currentTimeMillis())
                          .apply();
                  } catch (Exception ignored) {}
              }
              public static void clearPlayerLaunchMarker() {
                  try {
                      MainActivity a = instance;
                      if (a == null) return;
                      a.getSharedPreferences(PLAYER_PREFS, MODE_PRIVATE).edit()
                          .remove(PLAYER_LAUNCH_KEY).remove(PLAYER_STAGE_KEY).apply();
                  } catch (Exception ignored) {}
              }
              private static String getPlayerLaunchMarker() {
                  try {
                      MainActivity a = instance;
                      if (a == null) return null;
                      return a.getSharedPreferences(PLAYER_PREFS, MODE_PRIVATE).getString(PLAYER_LAUNCH_KEY, null);
                  } catch (Exception ignored) { return null; }
              }
              private static String getPlayerLoadStage() {
                  try {
                      MainActivity a = instance;
                      if (a == null) return null;
                      return a.getSharedPreferences(PLAYER_PREFS, MODE_PRIVATE).getString(PLAYER_STAGE_KEY, null);
                  } catch (Exception ignored) { return null; }
              }
              private static String escapeJs(String s) {
                  if (s == null) return "";
                  return s.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ").replace("\r", " ");
              }

              /* Bridge the page calls: the page tells us when a game is
                 playing (so the rocker keys become game buttons) and asks
                 whether this is a TV (so it can use the big layout). */
              private class LynxosBridge {
                  @JavascriptInterface
                  public void setPlaying(boolean p) { gamePlaying = p; }
                  @JavascriptInterface
                  public boolean isTV() { return isTV; }

                  /* Native PS1 player: the page streams the game file
                     here in base64 chunks; nativeEnd launches the
                     player Activity with the finished file. Each call
                     returns "ok" or "error: ...". */
                  @JavascriptInterface
                  public String nativeBegin(String title, String system, long totalBytes) {
                      try {
                          nativeCancel();
                          /* Single-file exports land straight in the
                             extract-once cache (filesDir, not
                             cacheDir): after nativeEnd writes
                             main.txt, later launches skip the send. */
                          File dir = extractCacheDir(title, system);
                          dir.mkdirs();
                          String safe = title.replaceAll("[^A-Za-z0-9._-]", "_");
                          if (safe.isEmpty()) safe = "game";
                          nativeTitle = title;
                          nativeSystem = system;
                          nativeCore = "";
                          nativeGameFile = new File(dir, safe + ".bin");
                          nativeOut = new FileOutputStream(nativeGameFile);
                          nativeTotal = totalBytes;
                          nativeWritten = 0;
                          return "ok";
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }
                  @JavascriptInterface
                  public String nativeChunk(String base64) {
                      try {
                          if (nativeOut == null) return "error: no export in progress";
                          byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                          nativeOut.write(bytes);
                          nativeWritten += bytes.length;
                          return "ok";
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }
                  @JavascriptInterface
                  public String nativeEnd() {
                      try {
                          if (nativeMulti) {
                              /* Every file must have been closed by
                                 nativeEndFile, which is what verifies
                                 its byte count; launching with a file
                                 still open would risk a truncated
                                 game, so fail loudly instead. */
                              if (nativeOut != null) return "error: file not finished";
                              if (nativeMainFile == null || !nativeMainFile.exists()) {
                                  nativeCancel();
                                  return "error: no main game file";
                              }
                              /* Complete export: record the play file
                                 so later launches can use the cache. */
                              writeMainFile(nativeMultiDir, nativeMainFile.getName());
                              launchNativePlayer(nativeMainFile);
                              clearExportState();
                              return "ok";
                          }
                          if (nativeOut == null) return "error: no export in progress";
                          nativeOut.close();
                          nativeOut = null;
                          if (nativeWritten != nativeTotal || nativeGameFile == null || !nativeGameFile.exists()) {
                              nativeCancel();
                              return "error: incomplete file";
                          }
                          /* Complete export: record the play file so
                             later launches can use the cache. */
                          writeMainFile(nativeGameFile.getParentFile(), nativeGameFile.getName());
                          launchNativePlayer(nativeGameFile);
                          clearExportState();
                          return "ok";
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }

                  /* After a successful launch the export is done:
                     drop the file references WITHOUT deleting the
                     files — they are the extract-once cache now, and
                     a later nativeCancel must not wipe them. */
                  private void clearExportState() {
                      nativeGameFile = null;
                      nativeMultiDir = null;
                      nativeMainFile = null;
                      nativeMulti = false;
                      nativeWritten = 0;
                      nativeTotal = 0;
                  }

                  /* Shared by both export paths: start the player
                     Activity for the finished game file. */
                  private void launchNativePlayer(File gameFile) {
                      Intent i;
                      if ("n64".equals(nativeSystem)) {
                          i = new Intent(MainActivity.this, NativeN64PlayerActivity.class);
                          i.putExtra("core", "mupen".equals(nativeCore) ? "mupen" : "parallel");
                      } else {
                          i = new Intent(MainActivity.this, NativePlayerActivity.class);
                      }
                      i.putExtra("gamePath", gameFile.getAbsolutePath());
                      i.putExtra("gameTitle", nativeTitle);
                      startActivity(i);
                      gamePlaying = true;
                      nativePlayerLaunched = true;
                      setPlayerLaunchMarker(nativeSystem, nativeTitle);
                  }
                  @JavascriptInterface
                  public void nativeCancel() {
                      try {
                          if (nativeOut != null) { nativeOut.close(); nativeOut = null; }
                      } catch (Exception ignored) {}
                      if (nativeMulti && nativeMultiDir != null) {
                          deleteRecursive(nativeMultiDir);
                      } else if (nativeGameFile != null) {
                          nativeGameFile.delete();
                      }
                      nativeGameFile = null;
                      nativeMultiDir = null;
                      nativeMainFile = null;
                      nativeMulti = false;
                      nativeWritten = 0;
                      nativeTotal = 0;
                      nativeSystem = "";
                      nativeCore = "";
                  }

                  /* Delete a file or a whole directory tree (the
                     multi-file export folder). */
                  private void deleteRecursive(File f) {
                      if (f == null) return;
                      if (f.isDirectory()) {
                          File[] kids = f.listFiles();
                          if (kids != null) {
                              for (File kid : kids) deleteRecursive(kid);
                          }
                      }
                      f.delete();
                  }
                  /* Native N64 player: which core the page picked
                     ("parallel" or "mupen"). Called right after
                     nativeBegin for N64 games; nativeEnd uses it to
                     pick the player Activity. */
                  @JavascriptInterface
                  public void nativeSetCore(String core) {
                      nativeCore = core == null ? "" : core;
                  }

                  /* Multi-file export: the page unpacked an archive
                     and sends its disc files one at a time into
                     native-games/<title>/. nativeBeginFile and
                     nativeEndFile bracket each file; nativeEnd
                     launches with the file named by
                     nativeSetMainFile. Each call returns "ok" or
                     "error: ...". */
                  @JavascriptInterface
                  public String nativeBeginMulti(String title, String system) {
                      try {
                          nativeCancel();
                          String safe = title.replaceAll("[^A-Za-z0-9._-]", "_");
                          if (safe.isEmpty()) safe = "game";
                          /* Multi-file exports land straight in the
                             extract-once cache: a re-extract wipes
                             the old cache for this game first (it is
                             stale by definition), and nativeEnd
                             writes main.txt once every file checks
                             out, so later launches skip the extract
                             and the send entirely. */
                          nativeMultiDir = extractCacheDir(title, system);
                          deleteRecursive(nativeMultiDir);
                          nativeMultiDir.mkdirs();
                          nativeTitle = title;
                          nativeSystem = system;
                          nativeCore = "";
                          nativeMainFile = null;
                          nativeMulti = true;
                          return "ok";
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }
                  @JavascriptInterface
                  public String nativeBeginFile(String fileName, long totalBytes) {
                      try {
                          if (!nativeMulti || nativeMultiDir == null) return "error: no multi-file export in progress";
                          if (nativeOut != null) return "error: previous file not finished";
                          String base = baseNameOf(fileName);
                          if (base.isEmpty()) return "error: bad file name";
                          nativeGameFile = new File(nativeMultiDir, base);
                          nativeOut = new FileOutputStream(nativeGameFile);
                          nativeTotal = totalBytes;
                          nativeWritten = 0;
                          return "ok";
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }
                  @JavascriptInterface
                  public String nativeEndFile() {
                      try {
                          if (nativeOut == null) return "error: no file in progress";
                          nativeOut.close();
                          nativeOut = null;
                          if (nativeWritten != nativeTotal || nativeGameFile == null || !nativeGameFile.exists()) {
                              if (nativeGameFile != null) nativeGameFile.delete();
                              nativeGameFile = null;
                              return "error: incomplete file";
                          }
                          return "ok";
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }
                  @JavascriptInterface
                  public String nativeSetMainFile(String fileName) {
                      try {
                          if (!nativeMulti || nativeMultiDir == null) return "error: no multi-file export in progress";
                          String base = baseNameOf(fileName);
                          if (base.isEmpty()) return "error: bad file name";
                          nativeMainFile = new File(nativeMultiDir, base);
                          return "ok";
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }

                  /* Archive entry names may carry folders ("disc/
                     game.bin"); only the basename ever reaches the
                     disk, so the .cue's FILE lines and the files
                     next to it always agree. */
                  private String baseNameOf(String fileName) {
                      if (fileName == null) return "";
                      String base = fileName.replace('\\', '/');
                      int slash = base.lastIndexOf('/');
                      if (slash >= 0) base = base.substring(slash + 1);
                      base = base.replaceAll("[^A-Za-z0-9._-]", "_");
                      return base;
                  }

                  /* Extract-once cache key: sanitised title + system.
                     The page never computes this — the bridge owns it,
                     so the two sides cannot disagree. */
                  private String cacheKey(String title, String system) {
                      String safe = title == null ? "" : title.replaceAll("[^A-Za-z0-9._-]", "_");
                      if (safe.isEmpty()) safe = "game";
                      return safe + "__" + (system == null ? "" : system);
                  }
                  private File extractCacheDir(String title, String system) {
                      File root = new File(getFilesDir(), "extracted-games");
                      return new File(root, cacheKey(title, system));
                  }
                  /* Record the play file after a complete export.
                     Only nativeEnd calls this, after its byte-count
                     checks — so main.txt means "complete". */
                  private void writeMainFile(File dir, String name) {
                      try {
                          FileOutputStream out = new FileOutputStream(new File(dir, "main.txt"));
                          try { out.write(name.getBytes("UTF-8")); } finally { out.close(); }
                      } catch (Exception ignored) {}
                  }
                  private String readMainFile(File dir) {
                      try {
                          java.io.FileInputStream in = new java.io.FileInputStream(new File(dir, "main.txt"));
                          try {
                              byte[] buf = new byte[512];
                              int n = in.read(buf);
                              if (n <= 0) return "";
                              return new String(buf, 0, n, "UTF-8").trim();
                          } finally { in.close(); }
                      } catch (Exception e) { return ""; }
                  }

                  /* Extract-once cache: returns the play file name
                     when this game has a complete cached extraction,
                     else "". The page launches from the cache instead
                     of re-extracting and re-sending. */
                  @JavascriptInterface
                  public String nativeCachedMainFile(String title, String system) {
                      try {
                          File dir = extractCacheDir(title, system);
                          String main = readMainFile(dir);
                          if (main.isEmpty()) return "";
                          File f = new File(dir, main);
                          return f.exists() ? main : "";
                      } catch (Exception e) {
                          return "";
                      }
                  }
                  /* Launch the player straight from a cached
                     extraction — no re-extract, no re-send. Returns
                     "ok" or "error: ..."; the page falls back to the
                     normal export on any error. */
                  @JavascriptInterface
                  public String nativeLaunchCached(String title, String system, String core) {
                      try {
                          File dir = extractCacheDir(title, system);
                          String main = readMainFile(dir);
                          if (main.isEmpty()) return "error: no cached game";
                          File f = new File(dir, main);
                          if (!f.exists()) return "error: cached game file is missing";
                          nativeTitle = title;
                          nativeSystem = system;
                          nativeCore = core == null ? "" : core;
                          /* No export is in progress: clear any stale
                             file references without deleting anything,
                             so a later nativeCancel cannot wipe this
                             cache. (A failed export's partial files
                             were already removed by nativeCancel in
                             the page's error path.) */
                          try { if (nativeOut != null) nativeOut.close(); } catch (Exception ignored) {}
                          nativeGameFile = null;
                          nativeMultiDir = null;
                          nativeMainFile = null;
                          nativeMulti = false;
                          nativeOut = null;
                          launchNativePlayer(f);
                          return "ok";
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }
                  /* Drop one game's extracted cache (called when the
                     game is deleted from the library). Best effort. */
                  @JavascriptInterface
                  public void nativeDeleteCache(String title, String system) {
                      try { deleteRecursive(extractCacheDir(title, system)); } catch (Exception ignored) {}
                  }
              }

              /* Shared with RemoteKeyService (the accessibility
                 service that sees the bottom app buttons): it only
                 acts while a game is playing on TV, and reports
                 each key's code to the page for the button test. */
              public static boolean isGamePlaying() {
                  return instance != null && instance.gamePlaying;
              }
              public static boolean isTvMode() {
                  return instance != null && instance.isTV;
              }
              public static void reportKeyFromService(final int code) {
                  final MainActivity a = instance;
                  if (a == null || a.webView == null) return;
                  a.webView.post(new Runnable() {
                      @Override public void run() {
                          a.webView.evaluateJavascript(
                              "(function(){ try { if (window.__remoteKeyTest) window.__remoteKeyTest(" + code + "); } catch(e){} })()", null);
                      }
                  });
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Uri data = getIntent() != null ? getIntent().getData() : null;
                  if (data != null && "com.lynxosretro.app".equals(data.getScheme())) {
                      pendingAuthUrl = data.toString();
                  }
                  webView = new WebView(this);
                  instance = this;
                  webView.setBackgroundColor(0xFF000000);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pageReady = true;
                          gamePlaying = false; /* fresh page = library */
                          if (runLatched) MainActivity.this.releaseLatchedB();
                          if (isTV) {
                              /* Belt and braces: make sure the TV
                                 layout is on even if the page's own
                                 bridge check ever misses. */
                              webView.evaluateJavascript("document.body.classList.add('tv')", null);
                          }
                          if (pendingAuthUrl != null) {
                              final String u = pendingAuthUrl; pendingAuthUrl = null;
                              forwardAuth(u);
                          }
                      }
                  });
                  /* File picker: the Add Game screen uses an <input
                     type="file">, which does nothing in a WebView unless
                     the app answers onShowFileChooser. */
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileChooserCallback != null) fileChooserCallback.onReceiveValue(null);
                          fileChooserCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(intent, "Pick a game file"), FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              fileChooserCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  /* TV detection + JS bridge, before the page loads. */
                  try {
                      UiModeManager um = (UiModeManager) getSystemService(UI_MODE_SERVICE);
                      isTV = um != null && um.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION;
                  } catch (Exception ignored) {}
                  webView.addJavascriptInterface(new LynxosBridge(), "LynxosRetro");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              /* Returning from the native player: the WebView still
                 shows the player screen behind it, so bring the
                 library back and hand the remote keys to the UI. */
              @Override
              protected void onResume() {
                  super.onResume();
                  if (nativePlayerLaunched) {
                      nativePlayerLaunched = false;
                      gamePlaying = false;
                      if (webView != null) {
                          webView.post(new Runnable() {
                              @Override public void run() {
                                  /* A player outcome to announce: the
                                     player's own speech may be silent
                                     on the TV, so the page says it
                                     through TalkBack when we return. */
                                  String oSystem, oKind, oReason;
                                  synchronized (MainActivity.class) {
                                      oSystem = pendingOutcomeSystem;
                                      oKind = pendingOutcomeKind;
                                      oReason = pendingOutcomeReason;
                                      pendingOutcomeSystem = null;
                                      pendingOutcomeKind = null;
                                      pendingOutcomeReason = null;
                                  }
                                  if (oKind != null) {
                                      webView.evaluateJavascript(
                                          "try{if(window.handlePlayerOutcome)window.handlePlayerOutcome('" +
                                          escapeJs(oSystem) + "','" + escapeJs(oKind) + "','" +
                                          escapeJs(oReason) + "');}catch(e){}",
                                          null);
                                  }
                                  webView.evaluateJavascript(
                                      "try{showScreen('library');setPlayingBridge(false);}catch(e){}",
                                      null);
                              }
                          });
                      }
                  }
                  /* Silent death: the player launched, but no outcome
                     was ever recorded and the marker is still there
                     (native crash, or a Java Error). Say so — with the
                     load stage if one was written — instead of
                     landing back at the library in silence. Markers
                     older than 10 minutes are dropped: the app was
                     probably just killed while backgrounded. */
                  checkSilentPlayerDeath();
              }

              private void checkSilentPlayerDeath() {
                  String marker = getPlayerLaunchMarker();
                  if (marker == null) return;
                  /* Split on the first and last pipes, not a plain
                     split: a game title could itself contain '|'. */
                  int firstPipe = marker.indexOf('|');
                  int lastPipe = marker.lastIndexOf('|');
                  if (firstPipe < 0 || lastPipe <= firstPipe) { clearPlayerLaunchMarker(); return; }
                  long when = 0;
                  try { when = Long.parseLong(marker.substring(lastPipe + 1)); } catch (Exception ignored) {}
                  if (when <= 0 || System.currentTimeMillis() - when > PLAYER_MARKER_MAX_AGE_MS) {
                      clearPlayerLaunchMarker();
                      return;
                  }
                  final String system = marker.substring(0, firstPipe);
                  final String stage = getPlayerLoadStage();
                  clearPlayerLaunchMarker();
                  final String reason;
                  if (stage == null || stage.isEmpty()) {
                      reason = "";
                  } else if ("running".equals(stage)) {
                      reason = "It was already running when it closed.";
                  } else {
                      reason = "It was still " + stage + ".";
                  }
                  deliverClosedOutcome(system, reason, 0);
              }

              /* The page may not be loaded yet when we come back
                 after a crash (fresh process, WebView still loading
                 index.html), so a one-shot evaluateJavascript can
                 silently no-op. Probe for handlePlayerOutcome and
                 retry until it exists, up to 10 seconds. */
              private void deliverClosedOutcome(final String system, final String reason, final int attempt) {
                  if (webView == null) return;
                  if (attempt > 20) return;
                  webView.evaluateJavascript(
                      "(typeof window.handlePlayerOutcome === 'function') ? '1' : '0'",
                      new ValueCallback<String>() {
                          @Override public void onReceiveValue(String value) {
                              if ("\"1\"".equals(value) || "1".equals(value)) {
                                  webView.evaluateJavascript(
                                      "try{if(window.handlePlayerOutcome)window.handlePlayerOutcome('" +
                                      escapeJs(system) + "','closed','" + escapeJs(reason) + "');}catch(e){}",
                                      null);
                              } else {
                                  mainHandler.postDelayed(new Runnable() {
                                      @Override public void run() {
                                          deliverClosedOutcome(system, reason, attempt + 1);
                                      }
                                  }, 500);
                              }
                          }
                      });
              }

              private void forwardAuth(final String url) {
                  final String escaped = url.replace("\\", "\\\\").replace("'", "\\'");
                  webView.post(new Runnable() {
                      @Override public void run() {
                          webView.evaluateJavascript(
                              "(function(){ try { if (window.handleAuthCallback) window.handleAuthCallback('" + escaped + "'); } catch(e){} })()",
                              null);
                      }
                  });
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  try {
                      Uri uri = intent.getData();
                      if (uri != null && "com.lynxosretro.app".equals(uri.getScheme())) {
                          if (pageReady) forwardAuth(uri.toString());
                          else pendingAuthUrl = uri.toString();
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST && fileChooserCallback != null) {
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          String ds = data.getDataString();
                          if (ds != null) results = new Uri[]{ Uri.parse(ds) };
                      }
                      fileChooserCallback.onReceiveValue(results);
                      fileChooserCallback = null;
                  }
              }

              /* Do not parcel WebView state (a large state bundle crashed the
                 file picker in Lynxos Music with TransactionTooLargeException). */
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  try { outState.clear(); } catch (Exception ignored) {}
              }

              /* Remote as a game controller (TV): the translation is
                 done here, with real key presses injected into the
                 WebView. The page used to translate keys itself with
                 synthetic DOM events, but the emulator listens for
                 keys on the game container, not the window, so those
                 presses never reached the game. Real injected keys
                 arrive exactly like a physical keyboard.
                 While a game is playing on TV, the sideways D-pad is
                 rotated 90 degrees (remote up = game left, remote
                 right = game up, remote down = game right, remote
                 left = game down); the channel rocker is A/B, OK tap
                 is Start, Back tap is X (the roll), and mute is
                 Select. Hold Back + another button for the extra
                 Super Nintendo buttons (Back+OK = Y, Back+channel-up
                 = L, Back+channel-down = R); a chord marks the Back
                 hold as used, so letting go of Back after a chord
                 does NOT exit — the exit only happens when Back is
                 held all by itself for half a second. Double-tap
                 channel-down to latch B (run) on and off for Mario.
                 The volume rocker stays mapped to A/B but the TV's
                 audio system swallows those keys before any app sees
                 them, so they never arrive. Outside a game every
                 button works normally. While a game is playing the
                 RemoteKeyService (accessibility service) reports
                 every other button's code to the page and swallows
                 the app buttons, so this activity only reports
                 buttons outside a game — plus any key it cannot
                 map while a game is playing, so a wrong code for
                 the channel rocker surfaces instead of silently
                 doing nothing. */
              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  int action = event.getAction();
                  if (code == KeyEvent.KEYCODE_BACK) {
                      if (action == KeyEvent.ACTION_DOWN) {
                          if (event.getRepeatCount() == 0) {
                              backDownTime = event.getEventTime();
                              backHeld = true;
                              backChordUsed = false;
                          }
                          return true;
                      }
                      if (action == KeyEvent.ACTION_UP) {
                          backHeld = false;
                          long held = event.getEventTime() - backDownTime;
                          if (gamePlaying) {
                              /* A chord was used while Back was held:
                                 the extra button already fired, so
                                 letting go of Back does nothing — no
                                 exit, no roll. The exit only happens
                                 when Back is held all by itself. */
                              if (backChordUsed) {
                                  backChordUsed = false;
                              } else if (held >= 500) {
                                  exitPlayer();
                              } else if (isTV) {
                                  injectKeyDownUp(KeyEvent.KEYCODE_S);
                              }
                          } else {
                              onBackPressed();
                          }
                          return true;
                      }
                      return true;
                  }
                  /* OK (centre button) is Start on every system:
                     it passes through to the WebView untouched, so
                     a tap starts and pauses any game. It used to be
                     tap = roll / hold = Start, but a tap that is not
                     Start cannot start a game — on Nintendo a tap
                     did nothing at all. The roll moved to Back tap. */
                  if (gamePlaying && isTV) {
                      /* Hold Back + another button = the extra Super
                         Nintendo buttons (chords). Back+OK is Y,
                         Back+channel-up is L, Back+channel-down is
                         R. The chord fires the moment the second
                         button is pressed, and it marks the Back
                         hold as used, so letting go of Back after a
                         chord does NOT exit the game — the exit only
                         happens when Back is held all by itself. */
                      if (backHeld && action == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                          int chordKey = chordButtonCode(code);
                          if (chordKey != 0) {
                              backChordUsed = true;
                              injectKeyDownUp(chordKey);
                              return true;
                          }
                      }
                      /* Channel-down (B) double-tap = latch run on
                         and off (for Mario: press twice quickly to
                         hold run without holding the button, press
                         again to let go). A single tap is a normal
                         B press. */
                      if (code == KeyEvent.KEYCODE_CHANNEL_DOWN) {
                          if (action == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                              if (runLatched) {
                                  releaseLatchedB();
                                  announceJs("Run off");
                                  return true;
                              }
                              long now = event.getEventTime();
                              if (now - lastChDnUpTime < 400) {
                                  runLatched = true;
                                  injectKeyDownOnly(KeyEvent.KEYCODE_Z);
                                  announceJs("Run on");
                                  return true;
                              }
                              injectKey(event, KeyEvent.KEYCODE_Z);
                              return true;
                          }
                          if (action == KeyEvent.ACTION_UP) {
                              lastChDnUpTime = event.getEventTime();
                              if (runLatched) return true;
                              injectKey(event, KeyEvent.KEYCODE_Z);
                              return true;
                          }
                          return true;
                      }
                      /* D-pad, remote held sideways (top to the
                         left), Justin's mapping: right arrow is up,
                         down arrow is forward (right), left arrow is
                         down, up arrow is back (left). Injected so
                         the keys reach the emulator container. */
                      int rotated = rotateDpadCode(code);
                      if (rotated != 0) {
                          injectKey(event, rotated);
                          return true;
                      }
                      int gameKey = gameButtonCode(code);
                      if (gameKey != 0) {
                          injectKey(event, gameKey);
                          return true;
                      }
                      /* A key this build cannot map (for example the
                         channel rocker if it sends a code other than
                         167): say its code out loud once, so the
                         mapping can be fixed instead of the button
                         silently doing nothing. */
                      if (action == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                          final int c = code;
                          webView.post(new Runnable() {
                              @Override public void run() {
                                  webView.evaluateJavascript(
                                      "(function(){ try { if (window.__remoteKeyTest) window.__remoteKeyTest(" + c + "); } catch(e){} })()", null);
                              }
                          });
                      }
                  }
                  if (action == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0
                          && !(gamePlaying && isTV)
                          && code != KeyEvent.KEYCODE_DPAD_UP
                          && code != KeyEvent.KEYCODE_DPAD_DOWN
                          && code != KeyEvent.KEYCODE_DPAD_LEFT
                          && code != KeyEvent.KEYCODE_DPAD_RIGHT
                          && code != KeyEvent.KEYCODE_DPAD_CENTER
                          && code != KeyEvent.KEYCODE_ENTER
                          && code != KeyEvent.KEYCODE_VOLUME_UP
                          && code != KeyEvent.KEYCODE_VOLUME_DOWN
                          && code != KeyEvent.KEYCODE_CHANNEL_UP
                          && code != KeyEvent.KEYCODE_CHANNEL_DOWN
                          && code != KeyEvent.KEYCODE_MUTE
                          && code != KeyEvent.KEYCODE_BACK) {
                      final int c = code;
                      webView.post(new Runnable() {
                          @Override public void run() {
                              webView.evaluateJavascript(
                                  "(function(){ try { if (window.__remoteKeyTest) window.__remoteKeyTest(" + c + "); } catch(e){} })()", null);
                          }
                      });
                  }
                  return super.dispatchKeyEvent(event);
              }

              /* Sideways D-pad, remote held with the top to the left:
                 right arrow = game up, down arrow = game right
                 (forward), left arrow = game down, up arrow = game
                 left (back). Returns 0 when the key is not a
                 D-pad direction. */
              private int rotateDpadCode(int code) {
                  if (code == KeyEvent.KEYCODE_DPAD_UP) return KeyEvent.KEYCODE_DPAD_LEFT;
                  if (code == KeyEvent.KEYCODE_DPAD_RIGHT) return KeyEvent.KEYCODE_DPAD_UP;
                  if (code == KeyEvent.KEYCODE_DPAD_DOWN) return KeyEvent.KEYCODE_DPAD_RIGHT;
                  if (code == KeyEvent.KEYCODE_DPAD_LEFT) return KeyEvent.KEYCODE_DPAD_DOWN;
                  return 0;
              }

              /* Rocker / mute buttons as game buttons (EmulatorJS
                 default keys: A = X, B = Z, X = S, Y = A key,
                 Select = Shift). The channel rocker is A/B — the
                 two buttons every system has (Nintendo, Game Boy,
                 Sega, Super Nintendo) — so this map works on every
                 platform. The volume rocker stays A/B but the TV's
                 audio system swallows those keys, so they never
                 arrive. Returns 0 for other keys. */
              private int gameButtonCode(int code) {
                  if (code == KeyEvent.KEYCODE_VOLUME_UP) return KeyEvent.KEYCODE_X;
                  if (code == KeyEvent.KEYCODE_VOLUME_DOWN) return KeyEvent.KEYCODE_Z;
                  if (code == KeyEvent.KEYCODE_CHANNEL_UP) return KeyEvent.KEYCODE_X;
                  if (code == KeyEvent.KEYCODE_CHANNEL_DOWN) return KeyEvent.KEYCODE_Z;
                  if (code == KeyEvent.KEYCODE_MUTE) return KeyEvent.KEYCODE_SHIFT_LEFT;
                  return 0;
              }

              /* Extra Super Nintendo buttons, reached by holding
                 Back and pressing another button. Y = A key, L = Q,
                 R = W (EmulatorJS defaults). Returns 0 otherwise. */
              private int chordButtonCode(int code) {
                  if (code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER) return KeyEvent.KEYCODE_A;
                  if (code == KeyEvent.KEYCODE_CHANNEL_UP) return KeyEvent.KEYCODE_Q;
                  if (code == KeyEvent.KEYCODE_CHANNEL_DOWN) return KeyEvent.KEYCODE_W;
                  return 0;
              }

              /* Send only a key-down (no key-up yet): used to latch
                 B on for the run latch. */
              private void injectKeyDownOnly(int code) {
                  long now = SystemClock.uptimeMillis();
                  final KeyEvent down = new KeyEvent(now, now, KeyEvent.ACTION_DOWN,
                      code, 0, 0, -1, 0, 0, InputDevice.SOURCE_KEYBOARD);
                  webView.dispatchKeyEvent(down);
              }

              /* Release a latched B (send the key-up that was held back). */
              private void releaseLatchedB() {
                  if (!runLatched) return;
                  runLatched = false;
                  long now = SystemClock.uptimeMillis();
                  final KeyEvent up = new KeyEvent(now, now, KeyEvent.ACTION_UP,
                      KeyEvent.KEYCODE_Z, 0, 0, -1, 0, 0, InputDevice.SOURCE_KEYBOARD);
                  webView.dispatchKeyEvent(up);
              }

              /* Speak a short message in the page (TalkBack reads the
                 live region). */
              private void announceJs(final String text) {
                  final String safe = text.replace("\\", "\\\\").replace("'", "\\'");
                  webView.post(new Runnable() {
                      @Override public void run() {
                          webView.evaluateJavascript(
                              "(function(){ try { if (window.__announce) window.__announce('" + safe + "'); } catch(e){} })()", null);
                      }
                  });
              }

              /* Inject a real key press into the WebView, built from
                 the remote's own event so down-time, repeats and
                 action (down/up) are preserved. */
              private void injectKey(KeyEvent src, int code) {
                  KeyEvent injected = new KeyEvent(
                      src.getDownTime(), src.getEventTime(), src.getAction(),
                      code, src.getRepeatCount(), src.getMetaState(),
                      src.getDeviceId(), 0, 0, InputDevice.SOURCE_KEYBOARD);
                  webView.dispatchKeyEvent(injected);
              }

              /* Inject a whole key press (down then up) at once,
                 for buttons decided on release (Back tap = X, the
                 roll). The key is held for a frame or two: a down
                 and up in the same instant can be missed by the
                 emulator's per-frame poll. */
              private void injectKeyDownUp(int code) {
                  long now = SystemClock.uptimeMillis();
                  final KeyEvent down = new KeyEvent(now, now, KeyEvent.ACTION_DOWN,
                      code, 0, 0, -1, 0, 0, InputDevice.SOURCE_KEYBOARD);
                  final KeyEvent up = new KeyEvent(now, now, KeyEvent.ACTION_UP,
                      code, 0, 0, -1, 0, 0, InputDevice.SOURCE_KEYBOARD);
                  webView.dispatchKeyEvent(down);
                  mainHandler.postDelayed(new Runnable() {
                      @Override public void run() { webView.dispatchKeyEvent(up); }
                  }, 60);
              }

              private void exitPlayer() {
                  if (runLatched) releaseLatchedB();
                  gamePlaying = false;
                  webView.post(new Runnable() {
                      @Override public void run() {
                          webView.evaluateJavascript(
                              "(function(){ try { if (window.__exitPlayer) window.__exitPlayer(); } catch(e){} })()", null);
                      }
                  });
              }

              @Override
              public void onBackPressed() {
                  if (backArmed) { backArmed = false; super.onBackPressed(); return; }
                  final Activity self = this;
                  try {
                      webView.evaluateJavascript(
                          "(function(){ try { if (window.tvBack) return window.tvBack(); } catch(e){} return 'exit'; })()",
                          new ValueCallback<String>() {
                              @Override
                              public void onReceiveValue(String value) {
                                  String v = value == null ? "exit" : value.replace("\"", "").trim();
                                  if ("exit".equals(v)) {
                                      backArmed = true;
                                      self.onBackPressed();
                                  }
                                  /* else: JS consumed the back press */
                              }
                          });
                  } catch (Exception e) {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (instance == this) instance = null;
                  try { if (webView != null) webView.destroy(); } catch (Exception ignored) {}
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/lynxosretro/app/RemoteKeyService.java <<'EOF'
          package com.lynxosretro.app;

          import android.accessibilityservice.AccessibilityService;
          import android.view.KeyEvent;
          import android.view.accessibility.AccessibilityEvent;

          /* Sees remote buttons before the system acts on them
             (AccessibilityService with flagRequestFilterKeyEvents).
             The bottom app buttons (YouTube, Netflix, ...) never
             reach a normal app — the system launches their apps
             instead — but this service sees every key first.
             v1.1.2 is the learning build: while a game is playing
             on TV it REPORTS each unknown key's code to the page
             (spoken + on screen, via __remoteKeyTest) and swallows
             keys the game activity does not handle, so pressing an
             app button cannot jump out of the game. The D-pad,
             Back, Enter and channel-up pass through silently —
             the activity already handles those. Volume, mute and
             channel-down are reported but passed through, so the
             report also tells us whether they reach an app at all.
             Outside a game every key passes through untouched, so
             the buttons keep their normal jobs. */
          public class RemoteKeyService extends AccessibilityService {
              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  /* Key-only service: nothing to do with screen events. */
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public boolean onKeyEvent(KeyEvent event) {
                  if (!MainActivity.isGamePlaying() || !MainActivity.isTvMode()) {
                      return false;
                  }
                  int code = event.getKeyCode();
                  int action = event.getAction();
                  /* Keys the activity already handles and we know
                     work: the D-pad, Back, Enter and channel-up.
                     Let them pass through silently. */
                  if (code == KeyEvent.KEYCODE_DPAD_UP
                          || code == KeyEvent.KEYCODE_DPAD_DOWN
                          || code == KeyEvent.KEYCODE_DPAD_LEFT
                          || code == KeyEvent.KEYCODE_DPAD_RIGHT
                          || code == KeyEvent.KEYCODE_DPAD_CENTER
                          || code == KeyEvent.KEYCODE_ENTER
                          || code == KeyEvent.KEYCODE_BACK
                          || code == KeyEvent.KEYCODE_CHANNEL_UP) {
                      return false;
                  }
                  /* Everything else gets reported once per press:
                     the app buttons we are learning, plus volume,
                     mute and channel-down — reporting those tells
                     us whether they reach an app at all. */
                  if (action == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                      MainActivity.reportKeyFromService(code);
                  }
                  /* Swallow the app buttons (and anything else
                     unknown) so they cannot jump out of the game;
                     let volume, mute and channel-down pass through
                     to the activity, which maps them when it can. */
                  if (code == KeyEvent.KEYCODE_VOLUME_UP
                          || code == KeyEvent.KEYCODE_VOLUME_DOWN
                          || code == KeyEvent.KEYCODE_MUTE
                          || code == KeyEvent.KEYCODE_CHANNEL_DOWN) {
                      return false;
                  }
                  return true;
              }
          }
          EOF
          echo "Scaffold complete."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build native N64 bridge (CMake)
        # AGP names this task externalNativeBuildRelease (there is no
        # buildCMakeRelease task): it compiles the C bridge so a
        # native error fails here, fast, instead of inside the APK
        # build below. assembleRelease would build it anyway.
        run: gradle :app:externalNativeBuildRelease

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lynxos-retro-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}+${{ inputs.version_code }}
          name: Lynxos Retro v${{ inputs.version_name }}+${{ inputs.version_code }}
          body: ${{ inputs.release_notes }}
          files: app/build/outputs/apk/release/app-release.apk
